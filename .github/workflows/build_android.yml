name: Build Android Patches

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Patches & Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Stockfish Binaries
        run: chmod +x ./.github/scripts/download_stockfish.sh && ./.github/scripts/download_stockfish.sh

      - name: Build Patches (.mpp) & Extension (.mpe)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid :extensions:extension:assembleRelease --no-daemon

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nhatnam-patches-bundle
          path: |
            patches/build/libs/*.mpp
            patches/build/libs/*.jar
            extensions/extension/build/outputs/**/*.apk
            extensions/extension/build/outputs/**/*.mpe
            patches-list.json
